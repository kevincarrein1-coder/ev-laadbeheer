name: Refresh charging data

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installeer afhankelijkheden
        run: pip install requests boto3

      - name: Haal laaddata op (alle bronnen)
        env:
          MONTA_CLIENT_ID: ${{ secrets.MONTA_CLIENT_ID }}
          MONTA_CLIENT_SECRET: ${{ secrets.MONTA_CLIENT_SECRET }}
          ENERGYVISION_API_KEY: ${{ secrets.ENERGYVISION_API_KEY }}
        run: python fetch_charging_data.py

      - name: Upload naar Mapbox-tileset
        env:
          MAPBOX_USERNAME: ${{ secrets.MAPBOX_USERNAME }}
          MAPBOX_SECRET_TOKEN: ${{ secrets.MAPBOX_SECRET_TOKEN }}
          MAPBOX_TILESET_ID: charging_stations
        run: python upload_to_mapbox.py
